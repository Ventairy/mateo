name: Check mateo-web-react

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - packages/typescript/**
      - .github/workflows/mateo-web-react-check.yml
      - .github/workflows/pull-request.yml

permissions:
  contents: read

jobs:
  package:
    name: Package checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: packages/typescript/.node-version

      - name: Set up pnpm
        run: npm install --global pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check workspace and package
        run: pnpm check

      - name: Require clean tracked files
        run: git diff --exit-code
