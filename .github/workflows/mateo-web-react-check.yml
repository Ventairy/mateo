name: Check mateo-web-react

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - packages/typescript/**
      - .github/workflows/mateo-web-react-check.yml
      - .github/workflows/pull-request.yml

permissions:
  contents: read

jobs:
  package:
    name: Package checks
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: packages/typescript/.node-version

      - name: Set up pnpm
        run: npm install --global pnpm@12.8.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install golden browser
        run: pnpm --filter @mateo/web-react exec playwright install chromium

      - name: Check workspace and package
        run: pnpm check

      - name: Upload golden failure images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mateo-web-react-golden-failures
          path: packages/typescript/mateo-web-react/.vitest/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

      - name: Require clean tracked files
        run: git diff --exit-code
