name: Dependency review

on:
  workflow_call:

permissions:
  contents: read

jobs:
  review:
    name: New dependency risk
    runs-on: ubuntu-latest
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: moderate
          # Pub.dev reports lowercase SPDX IDs (actions/dependency-review-action#1168).
          # Reviewed: code_assets 2.1.0 and native_toolchain_c 0.19.5 are BSD-3-Clause;
          # dotdart 0.12.0 and oh_my_flutter 0.29.0 are MIT.
          # alchemist 0.14.1 is MIT; build_runner 2.16.2 is BSD-3-Clause.
          # material_ui 1.11.0, cupertino_ui 1.1.6, listen 1.0.1,
          # test_api 0.7.14 and vector_math 2.4.4 are BSD-3-Clause;
          # cli_launcher 0.3.4+1 is MIT (verified from package LICENSE files).
          allow-dependencies-licenses: >-
            pkg:pub/code_assets,
            pkg:pub/native_toolchain_c,
            pkg:pub/dotdart,
            pkg:pub/oh_my_flutter,
            pkg:pub/alchemist,
            pkg:pub/build_runner,
            pkg:pub/material_ui,
            pkg:pub/cupertino_ui,
            pkg:pub/listen,
            pkg:pub/test_api,
            pkg:pub/vector_math,
            pkg:pub/cli_launcher
          deny-licenses: >-
            AGPL-1.0-only,
            AGPL-1.0-or-later,
            AGPL-3.0-only,
            AGPL-3.0-or-later,
            GPL-2.0-only,
            GPL-2.0-or-later,
            GPL-3.0-only,
            GPL-3.0-or-later
