name: Check mateo-mobile-flutter

on:
  workflow_call:
  push:
    branches:
      - main
    paths:
      - packages/dart/**
      - .github/workflows/mateo-mobile-flutter-check.yml

permissions:
  contents: read

jobs:
  package:
    name: Package checks
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/dart
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Flutter version
        id: fvmrc
        run: |
          echo "flutter-version=$(ruby -rjson -e 'puts JSON.parse(File.read(".fvmrc")).fetch("flutter")')" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ steps.fvmrc.outputs.flutter-version }}
          cache: true

      - name: Set up FVM
        run: |
          dart pub global activate fvm
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          fvm install

      - name: Install package dependencies
        run: |
          fvm flutter pub get

      - name: Require hosted release dependencies
        run: |
          test ! -f pubspec_overrides.yaml
          test ! -f mateo-mobile-flutter/pubspec_overrides.yaml

      - name: Generate source
        run: |
          fvm dart run melos run gen --no-select

      - name: Require committed generated source
        run: git diff --exit-code -- mateo-mobile-flutter/lib

      - name: Check formatting
        run: fvm dart run melos run format:check --no-select

      - name: Analyze package
        run: fvm dart run melos run analyze --no-select

      - name: Run tests
        run: fvm dart run melos run test --no-select

      - name: Validate API documentation
        run: fvm dart doc --validate-links
        working-directory: packages/dart/mateo-mobile-flutter
