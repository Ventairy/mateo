name: mateo_mobile_draft
description: The Flutter implementation of Mateo Mobile.
version: 0.0.1
publish_to: none
resolution: workspace

platforms:
  android:
  ios:

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  code_assets: ^2.0.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hooks: ^2.2.0
  native_toolchain_c: ^0.19.4
  oh_my_flutter: ^0.19.0

dev_dependencies:
  alchemist: ^0.14.0
  build_runner: ^2.15.0
  dotdart: ^0.10.2
  flutter_test:
    sdk: flutter

dotdart:
  output: lib/src/gen/
  svg:
    - assets/icons/

flutter:
  assets:
    - assets/icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_variable.ttf
        - asset: assets/fonts/inter_italic.ttf
          style: italic
