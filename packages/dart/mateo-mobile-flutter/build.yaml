targets:
  $default:
    builders:
      slang_build_runner:
        enabled: false
      # Avoid the post-process output collision: slang-i18n/slang#351.
      slang_build_runner:legacy:
        enabled: true
        options:
          base_locale: en
          fallback_strategy: base_locale
          input_directory: lib/src/components
          namespaces: true
          input_file_pattern: .i18n.json
          output_directory: lib/src/gen/i18n
          output_file_name: translations.g.dart
          lazy: false
          locale_handling: false
          flutter_integration: false
          translation_class_visibility: public
          timestamp: false
          format:
            enabled: true
            width: 120
