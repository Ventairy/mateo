name: mateo_mobile
description: The Flutter implementation of Mateo Mobile.
version: 0.0.1
publish_to: none
resolution: workspace

platforms:
  android:
  ios:

environment:
  sdk: ">=3.14.0 <4.0.0"
  flutter: ">=3.50.0"

dependencies:
  code_assets: ^2.1.0
  cupertino_ui: ^1.1.5
  data_assets: ^0.20.0
  diacritic: ^0.1.6
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  hooks: ^2.2.0
  intl: ^0.20.3
  material_ui: ^1.9.0
  meta: ^1.17.0
  native_toolchain_c: ^0.19.5
  oh_my_flutter: ^0.29.0
  record_use: ^1.1.1
  slang: ^4.19.2

dev_dependencies:
  alchemist: ^0.14.1
  build_runner: ^2.16.2
  dotdart: ^0.12.0
  flutter_test:
    sdk: flutter
  slang_build_runner: ^4.19.0

dotdart:
  output: lib/src/gen/
  svg:
    - assets/icons/
    - assets/flags/
  lottie:
    - assets/animated_icons/
  image:
    - assets/three_d_icons/

flutter:
  assets:
    - assets/flags/
    - assets/icons/
    - assets/animated_icons/
    - assets/three_d_icons/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter_variable.ttf
        - asset: assets/fonts/inter_italic.ttf
          style: italic
    - family: Fredoka
      fonts:
        - asset: assets/fonts/fredoka/fredoka-variable.ttf
          weight: 600
    - family: MomoSignature
      fonts:
        - asset: assets/fonts/momo-signature/momo-signature.ttf
